<!-- Tartalék, ha nem fut a JS: 2 mp múlva az App Store. -->
<meta http-equiv="refresh" content="2;url=https://apps.apple.com/hu/app/id6793034579">
<style>body{margin:0;background:#faf8f3;color:#1f2a24;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:grid;place-items:center;min-height:100vh;text-align:center;padding:24px}a{color:#2f5741}</style>
</head>
<body>
<p>Átirányítunk a FreshPlate-hez… <a id="l" href="https://apps.apple.com/hu/app/id6793034579">Ha nem történik semmi, koppints ide.</a></p>
<script>
  // Megosztás-link: iPhone/iPad → App Store KAMPÁNYLINK (ct = melyik megosztásból jött);
  // minden más → a landing, az Android-blokkhoz görgetve. A PT-t (provider token) az
  // App Store Connect kampánylink-generátorából kell ide írni; üresen sima Store-link.
  var PT = '', CT = 'share_goal', APP_ID = '6793034579';
  var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var store = PT ? 'https://apps.apple.com/app/apple-store/id' + APP_ID + '?pt=' + encodeURIComponent(PT) + '&ct=' + CT + '&mt=8'
                 : 'https://apps.apple.com/hu/app/id' + APP_ID;
  var target = ios ? store : 'https://freshplate.hu/?from=' + CT + '#android';
  document.getElementById('l').href = target;
  location.replace(target);
</script>
</body>
</html>
